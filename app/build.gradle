plugins {
    id 'com.android.application'
}

// GitHub Actions 또는 로컬 환경변수에서만 서명 정보를 읽습니다.
// 서명키와 비밀번호는 소스 저장소에 기록하지 않습니다.
def releaseStoreFile = System.getenv('MYBRAIN_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('MYBRAIN_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MYBRAIN_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MYBRAIN_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'kr.co.mybrain.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.co.mybrain.ai'
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName '1.9.4'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false

            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// ML Kit 내부 의존성이 가져오는 구형 jdk7·jdk8 Kotlin 모듈을 제외하고
// 통합된 kotlin-stdlib 한 버전만 사용해 중복 클래스를 방지합니다.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}

dependencies {
    // 시스템 카메라와 앱 캐시 파일을 안전하게 연결하는 FileProvider입니다.
    implementation 'androidx.core:core:1.15.0'

    // 한국어 모델을 APK에 포함하여 첫 OCR 실행 전 별도 다운로드를 줄입니다.
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
}
