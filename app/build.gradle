plugins {
    id 'com.android.application'
}

// 정식 Release 서명 정보는 GitHub Actions 또는 로컬 환경변수에서만 읽습니다.
// JKS 파일과 비밀번호는 소스 저장소에 기록하지 않습니다.
def releaseStoreFile = System.getenv('MYBRAIN_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('MYBRAIN_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MYBRAIN_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MYBRAIN_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// 개발 APK도 매 빌드마다 서명이 바뀌면 덮어쓰기 설치가 불가능합니다.
// 아래 인증서는 개발용으로만 공개 보관하며 정식 배포에는 절대 사용하지 않습니다.
def stableDebugBase64File = file('debug/mybrain-v2-debug.p12.b64')
def stableDebugStoreFile = file("${buildDir}/generated/signing/mybrain-v2-debug.p12")
if (!stableDebugBase64File.exists()) {
    throw new GradleException('고정 개발 서명 파일이 없습니다: ' + stableDebugBase64File)
}
stableDebugStoreFile.parentFile.mkdirs()
stableDebugStoreFile.bytes = java.util.Base64.decoder.decode(stableDebugBase64File.text.trim())

android {
    namespace 'kr.co.mybrain.v2'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.co.mybrain.v2'
        minSdk 26
        targetSdk 35
        versionCode 46
        versionName '2.0.0-alpha46'
    }

    signingConfigs {
        stableDebug {
            storeFile stableDebugStoreFile
            storePassword 'mybrain-debug-only'
            keyAlias 'mybrain-debug'
            keyPassword 'mybrain-debug-only'
            storeType 'PKCS12'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            signingConfig signingConfigs.stableDebug
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
