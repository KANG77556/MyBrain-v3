name: Apply Stage 15 AI Layout

on:
  pull_request:
    branches:
      - main
    paths:
      - 'tools/patch_stage15_ai_layout.py'
      - '.github/workflows/apply-stage15-ai-layout.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-layout:
    if: github.head_ref == 'stage15-ai-analysis-layout'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: stage15-ai-analysis-layout
          persist-credentials: true

      - name: Apply AI screen layout patch
        run: python3 tools/patch_stage15_ai_layout.py

      - name: Remove temporary patch files
        run: |
          rm -f tools/patch_stage15_ai_layout.py
          rm -f .github/workflows/apply-stage15-ai-layout.yml

      - name: Commit updated app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "MyBrain AI 1.8.6 AI 분석 실행 버튼 상단 배치 [skip ci]"
          git push origin HEAD:stage15-ai-analysis-layout
