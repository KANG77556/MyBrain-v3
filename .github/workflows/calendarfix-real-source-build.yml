name: Build Real CalendarFix v1.5.12 APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'android-build/calendarfix-v1512/READY'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and validate original Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f android-build/calendarfix-v1512/READY
          test "$(find android-build/calendarfix-v1512 -name 'part-*.b64' -type f | wc -l)" -eq 18
          mkdir -p build-input build-source
          cat android-build/calendarfix-v1512/part-*.b64 | base64 --decode > build-input/source.zip
          echo 'c5487b7d1f0adafb1118e5423513faa2d8f871c5aad8367a65effa387a5c7f71  build-input/source.zip' | sha256sum -c -
          unzip -t build-input/source.zip
          unzip -q build-input/source.zip -d build-source
          PROJECT_DIR=$(find build-source -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/res/layout/activity_calendar.xml"
          grep -q 'versionName = "1.5.12"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'android:layout_height="344dp"' "$PROJECT_DIR/app/src/main/res/layout/activity_calendar.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run unit tests and build real debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner-report.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee aapt-badging.txt
          grep -q "package: name='com.mybrain.app.debug'" aapt-badging.txt
          grep -q "versionName='1.5.12-debug'" aapt-badging.txt
          mkdir -p out
          cp "$APK" out/MyBrain-Android-v1.5.12-CalendarFix-REAL-GRADLE-debug.apk
          sha256sum out/MyBrain-Android-v1.5.12-CalendarFix-REAL-GRADLE-debug.apk > out/MyBrain-Android-v1.5.12-CalendarFix-REAL-GRADLE-debug.apk.sha256
          cp apksigner-report.txt aapt-badging.txt out/
          unzip -t out/MyBrain-Android-v1.5.12-CalendarFix-REAL-GRADLE-debug.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-Android-v1.5.12-CalendarFix-REAL-GRADLE-debug
          path: out/*
          if-no-files-found: error
          retention-days: 30
