name: CalendarFix v1.5.12 Gradle APK

on:
  push:
    branches:
      - calendarfix-v1512-gradle-build
    paths:
      - 'android-build/calendarfix-v1512/source.zip'
      - '.github/workflows/calendarfix-v1512-gradle.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate and extract attached source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=android-build/calendarfix-v1512/source.zip
          test -s "$SOURCE"
          ls -lh "$SOURCE"
          file "$SOURCE"
          sha256sum "$SOURCE" | tee source.sha256
          unzip -t "$SOURCE"
          rm -rf build-source
          mkdir build-source
          unzip -q "$SOURCE" -d build-source
          PROJECT_DIR=$(find build-source -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'versionName = "1.5.12"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -q 'android:layout_height="344dp"' "$PROJECT_DIR/app/src/main/res/layout/activity_calendar.xml"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Run tests and build APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Verify APK signature and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.mybrain.app.debug'" apk-badging.txt
          grep -q "versionName='1.5.12-debug'" apk-badging.txt
          mkdir -p out
          cp "$APK" out/MyBrain-Android-v1.5.12-CalendarFix-debug.apk
          sha256sum out/MyBrain-Android-v1.5.12-CalendarFix-debug.apk > out/MyBrain-Android-v1.5.12-CalendarFix-debug.apk.sha256
          cp apksigner.txt apk-badging.txt source.sha256 out/

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-Android-v1.5.12-CalendarFix-debug
          path: out/*
          if-no-files-found: error
          retention-days: 30
