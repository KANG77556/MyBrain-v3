name: MyBrain Stage 18 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-stage10.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-stage10.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android build
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-AI-1.8.9-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare APK
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MyBrain-AI-1.8.9-debug.apk
          sha256sum MyBrain-AI-1.8.9-debug.apk > MyBrain-AI-1.8.9-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-AI-1.8.9-APK
          path: |
            MyBrain-AI-1.8.9-debug.apk
            MyBrain-AI-1.8.9-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
