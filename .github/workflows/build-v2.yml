name: Build MyBrain AI V2

on:
  push:
    branches: ["rebuild/v2"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: SDK 35 설치
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 디버그 APK 빌드
        run: |
          set -o pipefail
          gradle --stacktrace assembleDebug 2>&1 | tee build.log

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MyBrainAI-v2-build-log
          path: build.log
          if-no-files-found: warn

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: MyBrainAI-v2-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
