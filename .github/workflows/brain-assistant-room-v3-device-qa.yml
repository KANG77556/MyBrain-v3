name: Brain Assistant Room v3 Device QA

on:
  workflow_dispatch:
  push:
    branches:
      - feature/brain-assistant-room-v3-qa
    paths:
      - 'android-build/room-v3-overlay.tar.xz.b64'
      - '.github/workflows/brain-assistant-room-v3-device-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'android-build/room-v3-overlay.tar.xz.b64'
      - '.github/workflows/brain-assistant-room-v3-device-qa.yml'

permissions:
  contents: read

jobs:
  build-and-device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout source carrier
        uses: actions/checkout@v4

      - name: Reconstruct project source
        shell: bash
        run: |
          cat android-build/brain-assistant-source.part* > brain-assistant-source.b64
          base64 --decode brain-assistant-source.b64 > brain-assistant-source.tar.xz
          echo '624b49911a8c2f3690898801cdf74d2ec8fc0765788ebdb19032389fd1cb4acf  brain-assistant-source.tar.xz' | sha256sum --check
          tar -xJf brain-assistant-source.tar.xz
          chmod +x brain-assistant/gradlew

      - name: Apply cumulative overlays and Room v3 changes
        shell: bash
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/g' brain-assistant/app/build.gradle.kts
          sed -i 's/lifecycle = "2.11.0"/lifecycle = "2.10.0"/g' brain-assistant/gradle/libs.versions.toml
          sed -i 's/core = "1.19.0"/core = "1.17.0"/g' brain-assistant/gradle/libs.versions.toml
          sed -i '/import androidx.compose.ui.test.assertDoesNotExist/d' brain-assistant/app/src/androidTest/java/com/seongho/brainassistant/feature/review/ReviewScreenTest.kt
          python - <<'PY'
          from pathlib import Path

          briefing = Path('brain-assistant/app/src/main/java/com/seongho/brainassistant/core/notification/BriefingWorker.kt')
          text = briefing.read_text()
          text = text.replace('import androidx.core.app.NotificationManagerCompat\n', '')
          text = text.replace(
              '        NotificationManagerCompat.from(applicationContext).notify(730, notification)\n',
              '        applicationContext.postNotificationIfAllowed(730, notification)\n',
          )
          briefing.write_text(text)

          scheduler = Path('brain-assistant/app/src/main/java/com/seongho/brainassistant/core/notification/NotificationScheduler.kt')
          text = scheduler.read_text()
          text = text.replace(
              'import android.Manifest\nimport android.content.Context\n',
              'import android.Manifest\nimport android.app.Notification\nimport android.content.Context\n',
          )
          text = text.replace(
              '        NotificationManagerCompat.from(applicationContext)\n            .notify(inputData.getInt(KEY_NOTIFICATION_ID, title.hashCode()), notification)\n',
              '        applicationContext.postNotificationIfAllowed(\n            inputData.getInt(KEY_NOTIFICATION_ID, title.hashCode()),\n            notification,\n        )\n',
          )
          text = text.replace(
              'internal fun Context.canPostNotifications(): Boolean =\n    android.os.Build.VERSION.SDK_INT < 33 ||\n        ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED\n',
              '''internal fun Context.canPostNotifications(): Boolean =
              android.os.Build.VERSION.SDK_INT < 33 ||
                  ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED

          internal fun Context.postNotificationIfAllowed(id: Int, notification: Notification): Boolean {
              if (!canPostNotifications()) return false
              return try {
                  NotificationManagerCompat.from(this).notify(id, notification)
                  true
              } catch (_: SecurityException) {
                  false
              }
          }
          ''',
          )
          scheduler.write_text(text)
          PY
          patch -d brain-assistant -p1 < android-build/device-calendar.patch
          cp -R android-build/dashboard-overlay/. brain-assistant/
          if [ -d android-build/feature-overlay ]; then
            cp -R android-build/feature-overlay/. brain-assistant/
          fi
          base64 --decode android-build/room-v3-overlay.tar.xz.b64 > room-v3-overlay.tar.xz
          echo '6100e6b1de0952af0efe5e2d900c7fc37f67c74fad5d72d3e6554f5d04f70b37  room-v3-overlay.tar.xz' | sha256sum --check
          tar -xJf room-v3-overlay.tar.xz -C brain-assistant

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure non-secret build values
        shell: bash
        run: |
          cat > brain-assistant/local.properties <<'EOF'
          GOOGLE_WEB_CLIENT_ID=1234567890-example.apps.googleusercontent.com
          AI_GATEWAY_BASE_URL=https://example.invalid/
          EOF

      - name: Run unit tests and build APKs
        working-directory: brain-assistant
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:assembleDebugAndroidTest \
            :app:assembleDebug
          mkdir -p qa-output
          sha256sum app/build/outputs/apk/debug/app-debug.apk > qa-output/app-debug.apk.sha256

      - name: Install and launch on Android 15 phone emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd brain-assistant
            mkdir -p qa-output
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.seongho.brainassistant.core.database
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.seongho.brainassistant.debug
            adb logcat -c
            ACTIVITY=$(adb shell cmd package resolve-activity --brief com.seongho.brainassistant.debug | tr -d '\r')
            test -n "$ACTIVITY"
            printf '%s\n' "$ACTIVITY" > qa-output/resolved-activity.txt
            adb shell am start -W -n "$ACTIVITY" | tee qa-output/launch-result.txt
            sleep 6
            adb shell pidof -s com.seongho.brainassistant.debug | tee qa-output/app-pid.txt
            test -s qa-output/app-pid.txt
            adb exec-out screencap -p > qa-output/device-home.png
            adb exec-out uiautomator dump /dev/tty > qa-output/device-ui.xml || (sleep 3 && adb exec-out uiautomator dump /dev/tty > qa-output/device-ui.xml)
            adb shell dumpsys window windows > qa-output/window-state.txt
            adb logcat -d > qa-output/device-logcat.txt
            adb logcat -b crash -d > qa-output/device-crash.txt
            if grep -Eq 'FATAL EXCEPTION|Process: com\.seongho\.brainassistant\.debug' qa-output/device-crash.txt; then
              echo '앱 크래시가 감지되었습니다.'
              cat qa-output/device-crash.txt
              exit 1
            fi

      - name: Upload APK and device QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brain-Assistant-Room-v3-Device-QA-${{ github.sha }}
          path: |
            brain-assistant/app/build/outputs/apk/debug/app-debug.apk
            brain-assistant/qa-output/
            brain-assistant/app/build/reports/tests/testDebugUnitTest/
            brain-assistant/app/build/reports/androidTests/connected/
          if-no-files-found: warn
          retention-days: 30
