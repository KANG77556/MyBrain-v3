name: ChalkakCoach Stage9 Build

on:
  pull_request:
    paths:
      - "chalkakcoach-stage9/**"
      - ".github/workflows/chalkakcoach-stage9.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p chalkakcoach-stage9/build
          cat chalkakcoach-stage9/source.tar.xz.b64.part-* > chalkakcoach-stage9/build/source.tar.xz.b64
          base64 --decode chalkakcoach-stage9/build/source.tar.xz.b64 > chalkakcoach-stage9/build/source.tar.xz
          echo "85cbd96ce63b961b88ce559372473586a21cb9525062adde9af141bc8c0818f6  chalkakcoach-stage9/build/source.tar.xz" | sha256sum -c -
          tar -xJf chalkakcoach-stage9/build/source.tar.xz -C chalkakcoach-stage9/build
          chmod +x chalkakcoach-stage9/build/ChalkakCoach/gradlew

      - name: Unit tests and debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd chalkakcoach-stage9/build/ChalkakCoach
          ./gradlew clean testDebugUnitTest assembleDebug --stacktrace 2>&1 | tee ../gradle-build.log

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/chalkakcoach-stage9/build"
          PROJECT="$ROOT/ChalkakCoach"
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          OUT="$ROOT/delivery"
          mkdir -p "$OUT"

          test -f "$APK"
          unzip -t "$APK" > "$OUT/APK-ZIP-TEST.txt"
          cp "$APK" "$OUT/ChalkakCoach-v0.9.0-Scene-AutoFraming-debug.apk"
          cp "$ROOT/gradle-build.log" "$OUT/GRADLE-BUILD-LOG.txt"
          cp "$PROJECT/CHANGELOG_STAGE9.md" "$OUT/CHANGELOG_STAGE9.md"
          cp "$PROJECT/TEST_CHECKLIST_STAGE9.md" "$OUT/TEST_CHECKLIST_STAGE9.md"
          cp "$PROJECT/BUILD_REPORT_STAGE9.md" "$OUT/BUILD_REPORT_STAGE9.md"
          (cd "$ROOT" && zip -qr "$OUT/ChalkakCoach-v0.9.0-Source.zip" ChalkakCoach)

          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          result_dir = Path('chalkakcoach-stage9/build/ChalkakCoach/app/build/test-results/testDebugUnitTest')
          tests = failures = errors = skipped = 0
          for path in result_dir.glob('TEST-*.xml'):
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          out = Path('chalkakcoach-stage9/build/delivery/TEST-SUMMARY.txt')
          out.write_text(
              f'tests={tests}\nfailures={failures}\nerrors={errors}\nskipped={skipped}\n',
              encoding='utf-8',
          )
          if failures or errors or tests < 71:
              raise SystemExit(f'Unexpected test result: tests={tests}, failures={failures}, errors={errors}')
          PY

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK" > "$OUT/APK-SIGNATURE-TEST.txt"
          sha256sum "$OUT"/*.apk "$OUT"/*.zip > "$OUT/SHA256SUMS.txt"

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChalkakCoach-Stage9-v0.9.0
          path: chalkakcoach-stage9/build/delivery
          retention-days: 14
