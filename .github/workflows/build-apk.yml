name: Build Brain Assistant APK

on:
  push:
    branches: ["build/brain-assistant-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 브레인 비서 v0.2 프로젝트 복원
        shell: bash
        run: |
          base64 --decode brain-assistant-android-source-v0.2.b64 > brain-assistant-source.zip
          unzip -q brain-assistant-source.zip
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md
          cp -a brain-assistant-android/. .

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: SDK 패키지 설치
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 브레인 비서 v0.2 APK 빌드
        run: gradle --stacktrace :app:assembleDebug

      - name: 브레인 비서 v0.2 APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: BrainAssistant-v0.2.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
