name: Build Brain Assistant APK

on:
  push:
    branches: ["build/brain-assistant-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 브레인 비서 v0.4 프로젝트 복원
        shell: bash
        run: |
          cat v03.part00 v03.part01 v03.part02 v03.part03 | base64 --decode > brain-assistant-source.zip
          unzip -q brain-assistant-source.zip
          rm -rf app build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties README.md
          cp -a brain-assistant-android/. .
          sed -i 's/toast("$type을 저장했습니다.")/toast("${type}을 저장했습니다.")/' app/src/main/java/com/brainassistant/app/MainActivity.kt
          python3 v04_patch.py

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: SDK 패키지 설치
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 브레인 비서 v0.4 APK 빌드
        shell: bash
        run: |
          gradle --stacktrace :app:assembleDebug > brain-build.log 2>&1
          tail -n 240 brain-build.log

      - name: APK 구조 및 서명 검증
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt 2>&1 || true
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > apk-signing.txt 2>&1 || true
          fi

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainAssistant-v0.4-build-log
          path: |
            brain-build.log
            apk-badging.txt
            apk-signing.txt
          if-no-files-found: warn

      - name: 브레인 비서 v0.4 APK 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainAssistant-v0.4.0-reminder-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
