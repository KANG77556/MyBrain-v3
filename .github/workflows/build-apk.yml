name: Inspect Brain Assistant Source

on:
  push:
    branches: ["build/brain-assistant-v1"]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4
      - name: v0.6 소스 복원
        shell: bash
        run: |
          cat v03.part00 v03.part01 v03.part02 v03.part03 | base64 --decode > brain-assistant-source.zip
          unzip -q brain-assistant-source.zip
          rm -rf app build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties README.md
          cp -a brain-assistant-android/. .
          sed -i 's/toast("$type을 저장했습니다.")/toast("${type}을 저장했습니다.")/' app/src/main/java/com/brainassistant/app/MainActivity.kt
          python3 v04_patch.py
          python3 v05_patch.py
          python3 v06_patch.py
      - name: 생성 소스 업로드
        uses: actions/upload-artifact@v4
        with:
          name: BrainAssistant-v0.6-generated-source
          path: |
            app/src/main/java/com/brainassistant/app/MainActivity.kt
            app/src/main/res/values/colors.xml
            app/src/main/res/values/themes.xml
            app/build.gradle.kts
