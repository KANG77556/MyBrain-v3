name: Build Brain Assistant APK

on:
  push:
    branches: ["build/brain-assistant-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: 브레인 비서 v0.3.1 프로젝트 복원 및 시작 오류 수정
        shell: bash
        run: |
          cat v03.part00 v03.part01 v03.part02 v03.part03 | base64 --decode > brain-assistant-source.zip
          unzip -q brain-assistant-source.zip
          rm -rf app build.gradle build.gradle.kts settings.gradle settings.gradle.kts gradle.properties README.md
          cp -a brain-assistant-android/. .
          sed -i 's/toast("$type을 저장했습니다.")/toast("${type}을 저장했습니다.")/' app/src/main/java/com/brainassistant/app/MainActivity.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/brainassistant/app/MainActivity.kt')
          s = p.read_text()
          old = '''        val masterKeyAlias = MasterKeys.getOrCreate(MasterKeys.AES256_GCM_SPEC)
                  encryptedPrefs = EncryptedSharedPreferences.create(
                      "secure_settings", masterKeyAlias, this,
                      EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                      EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                  )
                  dataPrefs = getSharedPreferences("brain_data", MODE_PRIVATE)
                  buildShell()
                  showHome()'''
          new = '''        encryptedPrefs = try {
                      val masterKeyAlias = MasterKeys.getOrCreate(MasterKeys.AES256_GCM_SPEC)
                      EncryptedSharedPreferences.create(
                          "secure_settings", masterKeyAlias, this,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  } catch (error: Exception) {
                      getSharedPreferences("secure_settings_fallback", MODE_PRIVATE)
                  }
                  dataPrefs = getSharedPreferences("brain_data", MODE_PRIVATE)
                  buildShell()
                  showHome()'''
          if old not in s:
              raise SystemExit('onCreate replacement target not found')
          p.write_text(s.replace(old, new))
          m = Path('app/src/main/AndroidManifest.xml')
          m.write_text(m.read_text().replace('android:name=".MainActivity"', 'android:name="com.brainassistant.app.MainActivity"'))
          g = Path('app/build.gradle.kts')
          g.write_text(g.read_text().replace('versionCode = 3', 'versionCode = 4').replace('versionName = "0.3.0"', 'versionName = "0.3.1"'))
          PY

      - name: Java 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 설치
        uses: android-actions/setup-android@v3

      - name: SDK 패키지 설치
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9 설치
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: 브레인 비서 v0.3.1 APK 빌드
        shell: bash
        run: |
          gradle --stacktrace :app:assembleDebug > brain-build.log 2>&1
          tail -n 200 brain-build.log

      - name: APK 구조 및 서명 검증
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > apk-badging.txt 2>&1 || true
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > apk-signing.txt 2>&1 || true
          fi

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainAssistant-v0.3.1-build-log
          path: |
            brain-build.log
            apk-badging.txt
            apk-signing.txt
          if-no-files-found: warn

      - name: 브레인 비서 v0.3.1 APK 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BrainAssistant-v0.3.1-startup-fix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
