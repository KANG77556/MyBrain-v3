name: Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-build/MyBrain-Android-v1.5.12-CalendarFix-BuildReady.zip'
      - '.github/workflows/android-debug-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Extract source
        shell: bash
        run: |
          test -f android-build/MyBrain-Android-v1.5.12-CalendarFix-BuildReady.zip
          rm -rf build-source
          mkdir build-source
          unzip -q android-build/MyBrain-Android-v1.5.12-CalendarFix-BuildReady.zip -d build-source
          PROJECT_DIR=$(find build-source -name gradlew -type f -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          cp "$APK" MyBrain-Android-v1.5.12-CalendarFix-debug.apk
          sha256sum MyBrain-Android-v1.5.12-CalendarFix-debug.apk > MyBrain-Android-v1.5.12-CalendarFix-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-Android-v1.5.12-CalendarFix-debug
          path: |
            ${{ env.PROJECT_DIR }}/MyBrain-Android-v1.5.12-CalendarFix-debug.apk
            ${{ env.PROJECT_DIR }}/MyBrain-Android-v1.5.12-CalendarFix-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
