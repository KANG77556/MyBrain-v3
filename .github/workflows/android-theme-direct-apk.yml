name: Android Theme Menu Direct APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-theme-menu-v1103
    paths:
      - 'app/**'
      - '.github/workflows/android-theme-direct-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/android-theme-direct-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate theme implementation
        shell: bash
        run: |
          grep -q '시스템 설정 따르기' app/src/main/java/kr/co/mybrain/ai/MainWorkspaceActivityV3.java
          grep -q '밝은 모드' app/src/main/java/kr/co/mybrain/ai/MainWorkspaceActivityV3.java
          grep -q '어두운 모드' app/src/main/java/kr/co/mybrain/ai/MainWorkspaceActivityV3.java
          grep -q 'KEY_THEME_MODE' app/src/main/java/kr/co/mybrain/ai/ThemeController.java
          grep -q "versionName '1.10.3-theme-menu'" app/build.gradle

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          cp "$APK" MyBrain-Android-v1.10.3-Theme-Menu-debug.apk
          unzip -t MyBrain-Android-v1.10.3-Theme-Menu-debug.apk >/dev/null
          sha256sum MyBrain-Android-v1.10.3-Theme-Menu-debug.apk > MyBrain-Android-v1.10.3-Theme-Menu-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-Android-v1.10.3-Theme-Menu-debug
          path: |
            MyBrain-Android-v1.10.3-Theme-Menu-debug.apk
            MyBrain-Android-v1.10.3-Theme-Menu-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
