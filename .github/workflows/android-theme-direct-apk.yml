name: Android Range Analysis APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-redesigned-home-v1104
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/android-theme-direct-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/android-theme-direct-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run Korean parser regression test
        shell: bash
        run: |
          rm -rf build/parser-regression
          mkdir -p build/parser-regression
          javac -encoding UTF-8 -d build/parser-regression \
            app/src/main/java/kr/co/mybrain/ai/AiAnalysisResult.java \
            app/src/main/java/kr/co/mybrain/ai/KoreanTimeRangeParser.java \
            app/src/main/java/kr/co/mybrain/ai/KoreanWeekRangeParser.java \
            app/src/main/java/kr/co/mybrain/ai/KoreanScheduleRangeParser.java \
            app/src/main/java/kr/co/mybrain/ai/QuickInputParser.java \
            scripts/ParserRegressionTest.java
          java -cp build/parser-regression ParserRegressionTest

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate redesigned home and range analysis
        shell: bash
        run: |
          python3 scripts/validate_redesigned_home_v1104.py
          grep -q 'KEY_THEME_MODE' app/src/main/java/kr/co/mybrain/ai/ThemeController.java
          grep -q 'HomeLayoutPolishEnhancer.install' app/src/main/java/kr/co/mybrain/ai/MyBrainApplication.java
          grep -q 'KoreanRangeAnalysisEnhancer.install' app/src/main/java/kr/co/mybrain/ai/MyBrainApplication.java
          grep -q '이번주' app/src/main/java/kr/co/mybrain/ai/KoreanWeekRangeParser.java
          grep -q 'item.endTime = time.endTime' app/src/main/java/kr/co/mybrain/ai/KoreanWeekRangeParser.java
          grep -q 'changed + "건에 종료 시간을 함께 저장했습니다."' app/src/main/java/kr/co/mybrain/ai/UnifiedQuickInputActivityV5.java
          grep -q "versionName '1.10.6-range-analysis'" app/build.gradle

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -s "$APK"
          cp "$APK" MyBrain-Android-v1.10.6-Range-Analysis-debug.apk
          unzip -t MyBrain-Android-v1.10.6-Range-Analysis-debug.apk >/dev/null
          sha256sum MyBrain-Android-v1.10.6-Range-Analysis-debug.apk > MyBrain-Android-v1.10.6-Range-Analysis-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyBrain-Android-v1.10.6-Range-Analysis-debug
          path: |
            MyBrain-Android-v1.10.6-Range-Analysis-debug.apk
            MyBrain-Android-v1.10.6-Range-Analysis-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
