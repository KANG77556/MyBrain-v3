name: Export CalendarFix Android Toolchain

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/calendarfix-toolchain.yml'
  workflow_dispatch:

jobs:
  export-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Prefetch exact CalendarFix build dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/calendarfix-prefetch
          mkdir -p /tmp/calendarfix-prefetch/app/src/main
          cat > /tmp/calendarfix-prefetch/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "CalendarFixPrefetch"
          include(":app")
          EOF
          cat > /tmp/calendarfix-prefetch/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "9.1.1" apply false
          }
          EOF
          cat > /tmp/calendarfix-prefetch/app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
              namespace = "com.mybrain.prefetch"
              compileSdk = 36
              defaultConfig { applicationId = "com.mybrain.prefetch"; minSdk = 26; targetSdk = 36; versionCode = 1; versionName = "1" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.16.0")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("net.zetetic:sqlcipher-android:4.17.0@aar")
              implementation("androidx.sqlite:sqlite:2.6.2")
              implementation("com.google.mlkit:text-recognition-korean:16.0.1")
              implementation("com.google.android.gms:play-services-code-scanner:16.1.0")
              testImplementation("junit:junit:4.13.2")
          }
          EOF
          cat > /tmp/calendarfix-prefetch/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@android:style/Theme.Material.Light" /></manifest>
          EOF
          cd /tmp/calendarfix-prefetch
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Package and split offline build toolchain
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_BIN=$(readlink -f "$(command -v gradle)")
          GRADLE_HOME=$(dirname "$(dirname "$GRADLE_BIN")")
          mkdir -p /tmp/calendarfix-toolchain/gradle /tmp/calendarfix-toolchain/android-sdk /tmp/calendarfix-toolchain/gradle-user-home
          cp -a "$GRADLE_HOME" /tmp/calendarfix-toolchain/gradle/home
          cp -a "$HOME/.gradle/caches" /tmp/calendarfix-toolchain/gradle-user-home/caches
          cp -a "$ANDROID_HOME/build-tools/36.0.0" /tmp/calendarfix-toolchain/android-sdk/build-tools-36.0.0
          cp -a "$ANDROID_HOME/platforms/android-36" /tmp/calendarfix-toolchain/android-sdk/platform-android-36
          cp -a "$ANDROID_HOME/platform-tools" /tmp/calendarfix-toolchain/android-sdk/platform-tools
          cp -a "$ANDROID_HOME/licenses" /tmp/calendarfix-toolchain/android-sdk/licenses
          cd /tmp
          tar --zstd -cf CalendarFix-Android-Offline-Toolchain.tar.zst calendarfix-toolchain
          sha256sum CalendarFix-Android-Offline-Toolchain.tar.zst > CalendarFix-Android-Offline-Toolchain.tar.zst.sha256
          split -b 300M -d -a 2 CalendarFix-Android-Offline-Toolchain.tar.zst CalendarFix-Android-Offline-Toolchain.part-
          ls -lh CalendarFix-Android-Offline-Toolchain.tar.zst CalendarFix-Android-Offline-Toolchain.part-*

      - name: Upload toolchain part 00
        uses: actions/upload-artifact@v4
        with:
          name: CalendarFix-Toolchain-Part-00
          path: /tmp/CalendarFix-Android-Offline-Toolchain.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 01
        uses: actions/upload-artifact@v4
        with:
          name: CalendarFix-Toolchain-Part-01
          path: /tmp/CalendarFix-Android-Offline-Toolchain.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload toolchain part 02 and checksum
        uses: actions/upload-artifact@v4
        with:
          name: CalendarFix-Toolchain-Part-02
          path: |
            /tmp/CalendarFix-Android-Offline-Toolchain.part-02
            /tmp/CalendarFix-Android-Offline-Toolchain.tar.zst.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
